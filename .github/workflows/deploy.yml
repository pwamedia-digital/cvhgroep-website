name: Deploy naar GitHub Pages

# Bouwt de Vite-site en publiceert hem naar GitHub Pages
# bij elke push naar main (en handmatig via de Actions-tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechten die nodig zijn om naar Pages te publiceren
permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; lopende runs worden niet afgebroken
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js opzetten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Bouwen
        run: npm run build

      - name: Pages configureren
        uses: actions/configure-pages@v5

      - name: Build-output uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployen naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
