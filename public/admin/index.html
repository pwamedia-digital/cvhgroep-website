<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>CVH Groep — Websitebeheer</title>
    <link rel="stylesheet" href="/cvhgroep-website/admin/admin-theme.css" />
  </head>
  <body>
    <script>
      // Migrate bookmarks/open tabs from the former combined homepage editor.
      // Without this, Sveltia shows a blank "create" form for the removed entry.
      const legacyCmsRoutes = [
        '#/collections/website/entries/homepage',
        '#/collections/website/new',
      ]

      if (legacyCmsRoutes.some((route) => window.location.hash.startsWith(route))) {
        window.location.replace(
          `${window.location.pathname}${window.location.search}#/collections/website/entries/opening`,
        )
      }
    </script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script src="/cvhgroep-website/admin/editor-controls.js"></script>
    <script src="/cvhgroep-website/admin/preview.js"></script>
  </body>
</html>
